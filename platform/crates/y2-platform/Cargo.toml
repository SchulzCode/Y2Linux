[package]
name = "y2-platform"
description = "/usr/sbin/y2-platform: the platform contract's command line (plan: strangler dispatcher)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
y2p-core = { path = "../y2p-core" }
y2p-contract = { path = "../y2p-contract" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
hmac.workspace = true

[features]
default = ["python-fallback"]
# The Python platform behind the dispatcher: a command line no Rust route takes (and a command that
# returns `Failure::Fallback`) replaces this process with main.py. Phase 6 builds without it
# (`--no-default-features`): then every subcommand and action must have a route (main.rs's test).
python-fallback = []
