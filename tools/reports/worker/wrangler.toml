# Y2Linux error report receiver (docs/planning/ERROR-REPORTS-PLAN.md, R3).
# Deploy: see tools/reports/README.md. The IDs below are filled in once by the
# owner (wrangler prints them when it creates the bucket and the namespace).
name = "y2linux-reports"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = false
routes = [
  { pattern = "reports.schulzcode.dev", custom_domain = true },
]

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "y2linux-reports"

[[kv_namespaces]]
binding = "RATES"
id = "50325fb617584e5a83f60e18aec88533"

# Secrets (never in this file): UPLOAD_KEY (the key built into the player's
# platform) and RATE_SALT (any long random text), set with `wrangler secret put`.

# No request logs: they would hold the players' IP addresses, which the
# receiver never stores (docs/ERROR-REPORTS.md). Errors answer 500 only.
[observability]
enabled = false
